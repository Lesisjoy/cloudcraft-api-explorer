<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Administrador de contactos conectado de forma segura a FastAPI.">
    <title>Directorio | Contactos</title>
    <style>
        :root { color-scheme: dark; --bg:#080b16; --panel:rgba(16,20,38,.84); --soft:rgba(255,255,255,.055); --line:rgba(255,255,255,.11); --ink:#f7f8ff; --muted:#aeb6d0; --violet:#a78bfa; --cyan:#67e8f9; --red:#fb7185; }
        * { box-sizing:border-box; }
        body { min-height:100vh; margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:radial-gradient(circle at 10% 10%,rgba(139,92,246,.22),transparent 32rem),radial-gradient(circle at 90% 80%,rgba(34,211,238,.14),transparent 28rem),var(--bg); }
        button,input,textarea { font:inherit; } button { cursor:pointer; }
        .shell { width:min(1180px,calc(100% - 32px)); margin:auto; padding:42px 0 64px; }
        header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:28px; }
        .eyebrow { margin:0 0 10px; color:var(--cyan); font-size:.78rem; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
        h1 { margin:0; font-size:clamp(2.25rem,6vw,4.5rem); letter-spacing:-.055em; }
        .subtitle { max-width:650px; margin:12px 0 0; color:var(--muted); line-height:1.65; }
        .button { min-height:44px; padding:10px 16px; color:var(--ink); border:1px solid var(--line); border-radius:12px; background:var(--soft); transition:.15s ease; }
        .button:hover { transform:translateY(-1px); border-color:rgba(255,255,255,.25); } .button:disabled { cursor:not-allowed; opacity:.55; transform:none; }
        .button.primary { color:#0a1020; border:0; background:linear-gradient(120deg,var(--violet),var(--cyan)); font-weight:800; }
        .status { display:none; margin:0 0 20px; padding:13px 16px; border:1px solid var(--line); border-radius:12px; color:var(--muted); background:rgba(255,255,255,.045); }
        .status.visible { display:block; } .status.error { color:#fecdd3; border-color:rgba(251,113,133,.35); background:rgba(251,113,133,.09); } .status.success { color:#bbf7d0; border-color:rgba(74,222,128,.3); background:rgba(74,222,128,.08); }
        .layout { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(310px,.8fr); gap:22px; }
        .panel { border:1px solid var(--line); border-radius:24px; background:var(--panel); box-shadow:0 24px 70px rgba(0,0,0,.28); backdrop-filter:blur(18px); }
        .panel-head { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:22px 24px; border-bottom:1px solid var(--line); } .panel-head h2 { margin:0; font-size:1.05rem; } .count { color:var(--muted); font-size:.88rem; }
        .contacts { min-height:330px; padding:10px; }
        .contact { display:grid; grid-template-columns:44px minmax(150px,1.2fr) minmax(140px,.9fr) auto; align-items:center; gap:14px; padding:13px 14px; border-radius:15px; }
        .contact + .contact { border-top:1px solid rgba(255,255,255,.065); } .contact:hover { background:rgba(255,255,255,.035); }
        .avatar { display:grid; place-items:center; width:42px; height:42px; border-radius:14px; color:#111827; background:linear-gradient(135deg,var(--violet),var(--cyan)); font-weight:900; }
        .contact strong,.contact span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .contact small { display:block; margin-top:4px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .contact-actions { display:flex; gap:7px; } .icon-button { width:38px; height:38px; padding:0; color:var(--muted); border:1px solid var(--line); border-radius:10px; background:transparent; } .icon-button:hover { color:var(--ink); background:rgba(255,255,255,.07); }
        .empty { padding:70px 24px; text-align:center; color:var(--muted); }
        form { padding:22px 24px 24px; } .field { margin-bottom:15px; } label { display:block; margin-bottom:7px; color:#dce1f2; font-size:.84rem; font-weight:700; }
        input,textarea { width:100%; padding:11px 12px; color:var(--ink); border:1px solid var(--line); border-radius:11px; outline:none; background:rgba(255,255,255,.045); } textarea { min-height:74px; resize:vertical; } input:focus,textarea:focus { border-color:var(--violet); box-shadow:0 0 0 3px rgba(167,139,250,.12); }
        .form-actions { display:flex; gap:9px; margin-top:20px; } .form-actions .primary { flex:1; }
        dialog { width:min(530px,calc(100% - 28px)); padding:0; color:var(--ink); border:1px solid var(--line); border-radius:22px; background:#11162a; box-shadow:0 30px 90px rgba(0,0,0,.65); } dialog::backdrop { background:rgba(3,5,12,.76); backdrop-filter:blur(5px); }
        .detail { padding:24px; } .detail h2 { margin:0 0 20px; } .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; } .detail-item { padding:13px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.035); } .detail-item small { display:block; margin-bottom:5px; color:var(--muted); } .detail-item.wide { grid-column:1/-1; } .dialog-actions { display:flex; justify-content:flex-end; margin-top:20px; }
        @media(max-width:850px){ header{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.editor{order:-1} }
        @media(max-width:600px){ .shell{width:min(100% - 20px,1180px);padding-top:24px}.contact{grid-template-columns:40px minmax(0,1fr) auto}.contact-meta{display:none}.detail-grid{grid-template-columns:1fr}.detail-item.wide{grid-column:auto} }
        @media(prefers-reduced-motion:reduce){ *,*::before,*::after{scroll-behavior:auto!important;transition:none!important} }
    </style>
</head>
<body>
    <main class="shell">
        <header>
            <div><p class="eyebrow">FastAPI · AWS · Vercel</p><h1>Directorio de contactos</h1><p class="subtitle">Consulta y administra los contactos almacenados en RDS a través de la API segura del proyecto.</p></div>
            <button class="button" id="reloadButton" type="button">↻ Recargar datos</button>
        </header>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="layout">
            <section class="panel" aria-labelledby="contactsTitle">
                <div class="panel-head"><h2 id="contactsTitle">Contactos</h2><span class="count" id="count">0 registros</span></div>
                <div class="contacts" id="contacts" aria-busy="true"><div class="empty">Cargando contactos…</div></div>
            </section>
            <section class="panel editor" aria-labelledby="formTitle">
                <div class="panel-head"><h2 id="formTitle">Nuevo contacto</h2></div>
                <form id="contactForm">
                    <input type="hidden" id="contacto_id" name="contacto_id">
                    <div class="field"><label for="nombre">Nombre</label><input id="nombre" name="nombre" required maxlength="100"></div>
                    <div class="field"><label for="apellido">Apellido</label><input id="apellido" name="apellido" required maxlength="100"></div>
                    <div class="field"><label for="telefono">Teléfono</label><input id="telefono" name="telefono" maxlength="30"></div>
                    <div class="field"><label for="correo">Correo</label><input id="correo" name="correo" type="email" maxlength="160"></div>
                    <div class="field"><label for="direccion">Dirección</label><textarea id="direccion" name="direccion" maxlength="255"></textarea></div>
                    <div class="field">
                        <label for="categoria_id">ID de categoría</label>
                        <input id="categoria_id" name="categoria_id" type="number" min="1" step="1" required inputmode="numeric">
                        <small id="categoryHint" style="display:block;margin-top:7px;color:var(--muted)">FastAPI requiere el identificador numérico de la categoría.</small>
                    </div>
                    <div class="form-actions"><button class="button" id="cancelButton" type="button" hidden>Cancelar</button><button class="button primary" id="saveButton" type="submit">Crear contacto</button></div>
                </form>
            </section>
        </div>
    </main>
    <dialog id="detailDialog"><div class="detail"><h2>Detalle del contacto</h2><div class="detail-grid" id="detailContent"></div><div class="dialog-actions"><button class="button" id="closeDialog" type="button">Cerrar</button></div></div></dialog>
    <script type="module" src="/app.js"></script>
</body>
</html>
